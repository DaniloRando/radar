name: Aggiorna dati Vinted

on:
  schedule:
    - cron: "17 5 * * *"   # ogni giorno alle 05:17 UTC (06:17 in inverno, 07:17 in estate)
  workflow_dispatch:        # pulsante "Run workflow" per lanciarlo a mano

permissions:
  contents: write

concurrency:
  group: vinted-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Installa dipendenze
        run: pip install -r scraper/requirements.txt

      - name: Scarica articoli
        env:
          VINTED_PROXY: ${{ secrets.VINTED_PROXY }}   # facoltativo, vedi README
        run: python scraper/scrape.py

      - name: Salva i dati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/items.json
          if git diff --cached --quiet; then
            echo "Nessuna novità"
          else
            git commit -m "Dati Vinted $(date -u +%F)"
            git push
          fi
